<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="300" fill="#f7f1e6"/>
  <text x="40" y="28" fill="#4a453c" font-size="12" font-weight="600">스윕 → CHoCH → 재방문 — 사건·확인·실행의 순서</text>

  <!-- range bounds -->
  <line x1="40" y1="70" x2="660" y2="70" stroke="#b08948" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="40" y1="170" x2="660" y2="170" stroke="#b08948" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="48" y="62" fill="#4a453c" font-size="10.5">레인지 상단 · range high</text>
  <text x="48" y="163" fill="#4a453c" font-size="10.5">레인지 하단 · range low</text>

  <!-- sell-stop cluster below range low -->
  <rect x="40" y="170" width="620" height="26" fill="#8f3d3a" opacity="0.08"/>
  <text x="560" y="187" fill="#8f3d3a" font-size="10">하단 아래 스톱 · sell stops</text>

  <!-- imbalance zone (FVG) left by displacement leg -->
  <rect x="355" y="140" width="105" height="32" fill="#2c5a4c" opacity="0.14"/>
  <text x="407" y="132" fill="#2c5a4c" font-size="9.5" text-anchor="middle">불균형 존 · imbalance</text>

  <!-- minor swing high / CHoCH level -->
  <line x1="290" y1="138" x2="410" y2="138" stroke="#b08948" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="305" cy="138" r="3.5" fill="none" stroke="#4a453c" stroke-width="1.4"/>

  <!-- price path -->
  <path d="M60 130 L100 92 L135 150 L170 168 L205 166 L240 208 L275 152 L305 138
           L330 158 L360 118 L395 80 L448 152 L485 100 L540 62 L640 54"
        fill="none" stroke="#4a453c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- equal lows -->
  <circle cx="170" cy="168" r="3.5" fill="#4a453c"/>
  <circle cx="205" cy="166" r="3.5" fill="#4a453c"/>
  <text x="150" y="190" fill="#4a453c" font-size="10">동일 저점 · equal lows</text>

  <!-- ① sweep -->
  <circle cx="240" cy="208" r="5" fill="#8f3d3a"/>

  <!-- ② CHoCH: crossing the minor high -->
  <circle cx="347" cy="138" r="5" fill="#b08948"/>

  <!-- ③ revisit into imbalance -->
  <circle cx="448" cy="152" r="5" fill="#2c5a4c"/>

  <!-- invalidation line -->
  <line x1="250" y1="222" x2="660" y2="222" stroke="#8f3d3a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="520" y="240" fill="#8f3d3a" font-size="10">무효화 · invalidation — 스윕 저점 이탈</text>

  <!-- legend -->
  <text x="350" y="270" fill="#4a453c" font-size="11" text-anchor="middle">
    <tspan fill="#8f3d3a" font-weight="700">①</tspan><tspan> 스윕 — 사건   </tspan>
    <tspan fill="#b08948" font-weight="700">②</tspan><tspan> CHoCH — 확인   </tspan>
    <tspan fill="#2c5a4c" font-weight="700">③</tspan><tspan> 불균형 재방문 — 실행</tspan>
  </text>
</svg>
