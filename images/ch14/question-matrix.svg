<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="350" fill="#f7f1e6"/>
  <text x="40" y="28" fill="#4a453c" font-size="12" font-weight="600">한 거래의 네 질문 — 기법은 답할 질문으로 배정된다</text>

  <!-- column headers -->
  <text x="115" y="50" fill="#8a7f70" font-size="10.5" text-anchor="middle">질문 · question</text>
  <text x="395" y="50" fill="#8a7f70" font-size="10.5" text-anchor="middle">답하는 기법 · tools</text>
  <text x="625" y="50" fill="#8a7f70" font-size="10.5" text-anchor="middle">답의 형태</text>

  <!-- sequence arrow on left margin -->
  <line x1="26" y1="66" x2="26" y2="316" stroke="#b08948" stroke-width="1.2"/>
  <path d="M26 322 l-4 -8 h8 z" fill="#b08948"/>
  <text x="18" y="70" fill="#b08948" font-size="9.5" transform="rotate(-90 18 190)" text-anchor="middle">읽는 순서</text>

  <!-- ROW 1: regime -->
  <rect x="40" y="60" width="150" height="58" rx="8" fill="none" stroke="#4a453c" stroke-width="1.3"/>
  <text x="50" y="76" fill="#b08948" font-size="10" font-weight="700">1</text>
  <text x="115" y="86" fill="#4a453c" font-size="11.5" font-weight="600" text-anchor="middle">지금 무슨 국면인가</text>
  <text x="115" y="104" fill="#8a7f70" font-size="9.5" text-anchor="middle">which regime</text>
  <line x1="196" y1="89" x2="222" y2="89" stroke="#b08948" stroke-width="1.4"/>
  <path d="M226 89 l-8 -4 v8 z" fill="#b08948"/>
  <rect x="230" y="60" width="330" height="58" rx="8" fill="#efe6d8"/>
  <text x="395" y="86" fill="#4a453c" font-size="10.5" text-anchor="middle">구조 HH/HL · ADX · 밴드폭</text>
  <text x="395" y="104" fill="#4a453c" font-size="10.5" text-anchor="middle">상위 타임프레임 · 와이코프 국면</text>
  <line x1="566" y1="89" x2="586" y2="89" stroke="#b08948" stroke-width="1.4"/>
  <path d="M590 89 l-8 -4 v8 z" fill="#b08948"/>
  <rect x="594" y="60" width="72" height="58" rx="8" fill="none" stroke="#2c5a4c" stroke-width="1.3"/>
  <text x="630" y="86" fill="#2c5a4c" font-size="10.5" font-weight="600" text-anchor="middle">추세</text>
  <text x="630" y="103" fill="#2c5a4c" font-size="10.5" font-weight="600" text-anchor="middle">레인지</text>

  <!-- ROW 2: where -->
  <rect x="40" y="132" width="150" height="58" rx="8" fill="none" stroke="#4a453c" stroke-width="1.3"/>
  <text x="50" y="148" fill="#b08948" font-size="10" font-weight="700">2</text>
  <text x="115" y="158" fill="#4a453c" font-size="11.5" font-weight="600" text-anchor="middle">어디서 할 것인가</text>
  <text x="115" y="176" fill="#8a7f70" font-size="9.5" text-anchor="middle">where</text>
  <line x1="196" y1="161" x2="222" y2="161" stroke="#b08948" stroke-width="1.4"/>
  <path d="M226 161 l-8 -4 v8 z" fill="#b08948"/>
  <rect x="230" y="132" width="330" height="58" rx="8" fill="#efe6d8"/>
  <text x="395" y="158" fill="#4a453c" font-size="10.5" text-anchor="middle">지지저항 존 · 프리미엄/디스카운트</text>
  <text x="395" y="176" fill="#4a453c" font-size="10.5" text-anchor="middle">프로파일 노드 · 피보 눈금</text>
  <line x1="566" y1="161" x2="586" y2="161" stroke="#b08948" stroke-width="1.4"/>
  <path d="M590 161 l-8 -4 v8 z" fill="#b08948"/>
  <rect x="594" y="132" width="72" height="58" rx="8" fill="none" stroke="#2c5a4c" stroke-width="1.3"/>
  <text x="630" y="168" fill="#2c5a4c" font-size="11" font-weight="600" text-anchor="middle">존</text>

  <!-- ROW 3: when -->
  <rect x="40" y="204" width="150" height="58" rx="8" fill="none" stroke="#4a453c" stroke-width="1.3"/>
  <text x="50" y="220" fill="#b08948" font-size="10" font-weight="700">3</text>
  <text x="115" y="230" fill="#4a453c" font-size="11.5" font-weight="600" text-anchor="middle">언제 들어가는가</text>
  <text x="115" y="248" fill="#8a7f70" font-size="9.5" text-anchor="middle">when</text>
  <line x1="196" y1="233" x2="222" y2="233" stroke="#b08948" stroke-width="1.4"/>
  <path d="M226 233 l-8 -4 v8 z" fill="#b08948"/>
  <rect x="230" y="204" width="330" height="58" rx="8" fill="#efe6d8"/>
  <text x="395" y="230" fill="#4a453c" font-size="10.5" text-anchor="middle">스윕 회수 · CHoCH · 패턴 완성</text>
  <text x="395" y="248" fill="#4a453c" font-size="10.5" text-anchor="middle">캔들 트리거 · 세션/변화일 윈도</text>
  <line x1="566" y1="233" x2="586" y2="233" stroke="#b08948" stroke-width="1.4"/>
  <path d="M590 233 l-8 -4 v8 z" fill="#b08948"/>
  <rect x="594" y="204" width="72" height="58" rx="8" fill="none" stroke="#2c5a4c" stroke-width="1.3"/>
  <text x="630" y="240" fill="#2c5a4c" font-size="10.5" font-weight="600" text-anchor="middle">트리거</text>

  <!-- ROW 4: how much -->
  <rect x="40" y="276" width="150" height="58" rx="8" fill="none" stroke="#4a453c" stroke-width="1.3"/>
  <text x="50" y="292" fill="#b08948" font-size="10" font-weight="700">4</text>
  <text x="115" y="302" fill="#4a453c" font-size="11.5" font-weight="600" text-anchor="middle">얼마나 걸 것인가</text>
  <text x="115" y="320" fill="#8a7f70" font-size="9.5" text-anchor="middle">how much</text>
  <line x1="196" y1="305" x2="222" y2="305" stroke="#b08948" stroke-width="1.4"/>
  <path d="M226 305 l-8 -4 v8 z" fill="#b08948"/>
  <rect x="230" y="276" width="330" height="58" rx="8" fill="#efe6d8"/>
  <text x="395" y="302" fill="#4a453c" font-size="10.5" text-anchor="middle">ATR · 측정 목표가 · R배수</text>
  <text x="395" y="320" fill="#4a453c" font-size="10.5" text-anchor="middle">고정 리스크 ÷ 손절 거리</text>
  <line x1="566" y1="305" x2="586" y2="305" stroke="#b08948" stroke-width="1.4"/>
  <path d="M590 305 l-8 -4 v8 z" fill="#b08948"/>
  <rect x="594" y="276" width="72" height="58" rx="8" fill="none" stroke="#2c5a4c" stroke-width="1.3"/>
  <text x="630" y="298" fill="#2c5a4c" font-size="10.5" font-weight="600" text-anchor="middle">거리</text>
  <text x="630" y="315" fill="#2c5a4c" font-size="10.5" font-weight="600" text-anchor="middle">크기</text>
</svg>
