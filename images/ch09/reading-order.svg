<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="270" fill="#f7f1e6"/>
  <!-- 가격 경로: 상승 → 머리어깨 → 넥라인 이탈 -->
  <path d="M45 208 L108 148 L142 136 L176 166 L216 92 L256 166 L296 140 L336 168 L378 214 L425 226" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 경계선(넥라인) -->
  <line x1="176" y1="166" x2="505" y2="166" stroke="#b08948" stroke-width="1.4" stroke-dasharray="6 4"/>
  <!-- 실패 경로: 넥라인 재탈환 -->
  <path d="M378 214 L415 182 L455 146" fill="none" stroke="#8f3d3a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- 측정 목표: 머리-넥라인 높이를 이탈점 아래로 투사 -->
  <line x1="640" y1="166" x2="640" y2="240" stroke="#b08948" stroke-width="1.4"/>
  <line x1="632" y1="166" x2="648" y2="166" stroke="#b08948" stroke-width="1.4"/>
  <line x1="632" y1="240" x2="648" y2="240" stroke="#b08948" stroke-width="1.4"/>
  <text x="540" y="206" fill="#b08948" font-size="11">측정 목표 · target</text>
  <!-- 단계 마커 -->
  <circle cx="78" cy="187" r="10" fill="#4a453c"/>
  <text x="78" y="191" fill="#f7f1e6" font-size="11" text-anchor="middle">1</text>
  <circle cx="336" cy="166" r="10" fill="#4a453c"/>
  <text x="336" y="170" fill="#f7f1e6" font-size="11" text-anchor="middle">2</text>
  <circle cx="392" cy="224" r="10" fill="#4a453c"/>
  <text x="392" y="228" fill="#f7f1e6" font-size="11" text-anchor="middle">3</text>
  <circle cx="455" cy="146" r="10" fill="#8f3d3a"/>
  <text x="455" y="150" fill="#f7f1e6" font-size="11" text-anchor="middle">4</text>
  <!-- 라벨 -->
  <text x="40" y="248" fill="#4a453c" font-size="12">① 선행 추세 · prior trend</text>
  <text x="500" y="152" fill="#b08948" font-size="12">② 경계선 · neckline</text>
  <text x="285" y="252" fill="#4a453c" font-size="12">③ 확인 · 경계 밖 종가 confirmed break</text>
  <text x="380" y="118" fill="#8f3d3a" font-size="12">④ 무효화 · 재탈환 reclaim</text>
  <text x="142" y="60" fill="#4a453c" font-size="11">머리어깨 · head &amp; shoulders</text>
</svg>
