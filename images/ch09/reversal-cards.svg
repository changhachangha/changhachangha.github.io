<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="720" height="340" fill="#f7f1e6"/>
  <text x="24" y="26" font-size="12" fill="#8a7f70" letter-spacing="0.4">REVERSAL CARDS — unfinished until confirmation</text>
  <line x1="360" y1="44" x2="360" y2="318" stroke="#b08948" stroke-width="0.7" opacity="0.4"/>

  <text x="24" y="52" fill="#4a453c" font-size="13">head and shoulders · head &amp; shoulders</text>
  <text x="24" y="70" fill="#8a7f70" font-size="11">turns an advance · a close through the neckline confirms</text>

  <line x1="150" y1="210" x2="344" y2="222" stroke="#b08948" stroke-width="1.4" stroke-dasharray="6 4"/>

  <path d="M28 286 L68 250 L90 260 L128 214" fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M128 214 L164 156 L198 214 L242 108 L286 218 L324 162" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M324 162 L338 222 L348 262" fill="none" stroke="#8f3d3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M348 262 L336 228 L322 188" fill="none" stroke="#8f3d3a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>

  <circle cx="164" cy="156" r="3.3" fill="#4a453c"/>
  <circle cx="242" cy="108" r="3.5" fill="#4a453c"/>
  <circle cx="324" cy="162" r="3.3" fill="#4a453c"/>
  <circle cx="198" cy="214" r="2.8" fill="#b08948"/>
  <circle cx="286" cy="218" r="2.8" fill="#b08948"/>
  <circle cx="348" cy="262" r="3.3" fill="#8f3d3a"/>

  <text x="128" y="148" fill="#4a453c" font-size="11">left shoulder</text>
  <text x="242" y="98" fill="#4a453c" font-size="11" text-anchor="middle">head</text>
  <text x="292" y="152" fill="#4a453c" font-size="11">right shoulder</text>
  <text x="156" y="242" fill="#b08948" font-size="11">neckline</text>
  <text x="24" y="312" fill="#2c5a4c" font-size="11">prior advance</text>
  <text x="110" y="312" fill="#8f3d3a" font-size="11">solid break = confirm</text>
  <text x="216" y="312" fill="#8f3d3a" font-size="11">dashed return = invalidation</text>

  <text x="384" y="52" fill="#4a453c" font-size="13">double bottom</text>
  <text x="384" y="70" fill="#8a7f70" font-size="11">turns a decline · the break of the middle high confirms</text>

  <line x1="520" y1="156" x2="690" y2="156" stroke="#b08948" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="568" y="148" fill="#b08948" font-size="11">middle high</text>

  <path d="M388 96 L434 150 L492 246" fill="none" stroke="#8f3d3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M492 246 L552 156 L618 242" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M618 242 L664 156 L692 118 L708 86" fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M664 156 L688 210" fill="none" stroke="#8f3d3a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>

  <circle cx="492" cy="246" r="3.4" fill="#8f3d3a"/>
  <circle cx="618" cy="242" r="3.4" fill="#8f3d3a"/>
  <circle cx="552" cy="156" r="3" fill="#b08948"/>
  <circle cx="664" cy="156" r="3.4" fill="#2c5a4c"/>

  <text x="500" y="272" fill="#8f3d3a" font-size="11">two lows at the same height</text>
  <text x="384" y="312" fill="#8f3d3a" font-size="11">prior decline</text>
  <text x="470" y="312" fill="#2c5a4c" font-size="11">solid break = confirm</text>
  <text x="590" y="312" fill="#8f3d3a" font-size="11">dashed = re-entry</text>
</svg>
