<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="270" fill="#f7f1e6"/>
  <!-- 왼쪽: 이름 없는 형상 -->
  <path d="M60 200 L95 140 L130 168 L165 110 L200 152 L235 118 L270 158 L302 132" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="60" y1="168" x2="302" y2="168" stroke="#b08948" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="312" y="140" fill="#b08948" font-size="22">?</text>
  <text x="60" y="240" fill="#4a453c" font-size="12">unnamed shape</text>
  <!-- 오른쪽: 새 카드 네 칸 -->
  <rect x="345" y="42" width="315" height="196" rx="6" fill="none" stroke="#b08948" stroke-width="1.5"/>
  <text x="362" y="66" fill="#4a453c" font-size="12" font-weight="600">a new card — fill the four fields</text>
  <circle cx="370" cy="94" r="8" fill="#4a453c"/>
  <text x="370" y="98" fill="#f7f1e6" font-size="10" text-anchor="middle">1</text>
  <text x="386" y="98" fill="#4a453c" font-size="12">prior trend — what it turns</text>
  <circle cx="370" cy="126" r="8" fill="#4a453c"/>
  <text x="370" y="130" fill="#f7f1e6" font-size="10" text-anchor="middle">2</text>
  <text x="386" y="130" fill="#4a453c" font-size="12">boundary — the line that declares completion</text>
  <circle cx="370" cy="158" r="8" fill="#4a453c"/>
  <text x="370" y="162" fill="#f7f1e6" font-size="10" text-anchor="middle">3</text>
  <text x="386" y="162" fill="#4a453c" font-size="12">confirmation — which close finishes it</text>
  <circle cx="370" cy="190" r="8" fill="#4a453c"/>
  <text x="370" y="194" fill="#f7f1e6" font-size="10" text-anchor="middle">4</text>
  <text x="386" y="194" fill="#4a453c" font-size="12">invalidation — the price that says it was wrong</text>
  <line x1="362" y1="212" x2="642" y2="212" stroke="#b08948" stroke-width="1"/>
  <text x="362" y="228" fill="#8f3d3a" font-size="11">leave one field empty and it is a story, not a catalog</text>
</svg>
