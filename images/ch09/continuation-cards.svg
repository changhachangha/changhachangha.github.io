<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="720" height="310" fill="#f7f1e6"/>
  <text x="24" y="26" font-size="12" fill="#8a7f70" letter-spacing="0.4">CONTINUATION — the side that breaks sets the direction</text>

  <text x="24" y="54" fill="#4a453c" font-size="13">ascending</text>
  <text x="24" y="72" fill="#8a7f70" font-size="11">flat resistance + rising lows</text>
  <line x1="28" y1="108" x2="196" y2="108" stroke="#8f3d3a" stroke-width="1.6"/>
  <line x1="28" y1="220" x2="196" y2="148" stroke="#2c5a4c" stroke-width="1.6"/>
  <text x="28" y="100" fill="#8f3d3a" font-size="10">resistance</text>
  <text x="36" y="242" fill="#2c5a4c" font-size="10">rising lows</text>
  <path d="M40 206 L68 114 L98 176 L128 112 L156 154 L184 116" fill="none" stroke="#4a453c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M184 116 L214 78" fill="none" stroke="#2c5a4c" stroke-width="1.7" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M168 150 L206 198" fill="none" stroke="#8f3d3a" stroke-width="1.7" stroke-dasharray="4 3" stroke-linecap="round"/>
  <text x="216" y="82" fill="#2c5a4c" font-size="10">up</text>
  <text x="208" y="214" fill="#8f3d3a" font-size="10">down</text>
  <text x="24" y="272" fill="#4a453c" font-size="11">dashed lines are possible breaks</text>
  <text x="24" y="290" fill="#8a7f70" font-size="10">a return inside is a false breakout</text>

  <text x="262" y="54" fill="#4a453c" font-size="13">flag</text>
  <text x="262" y="72" fill="#8a7f70" font-size="11">counter-slope channel after the pole</text>
  <line x1="350" y1="108" x2="450" y2="140" stroke="#b08948" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="364" y1="128" x2="464" y2="160" stroke="#b08948" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M278 236 L314 170 L346 104" fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M346 104 L372 131 L400 124 L428 148" fill="none" stroke="#4a453c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M428 148 L456 112 L492 74" fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="286" y="154" fill="#2c5a4c" font-size="11">pole</text>
  <text x="378" y="178" fill="#4a453c" font-size="11">flag</text>
  <text x="456" y="66" fill="#2c5a4c" font-size="11">top break</text>
  <text x="262" y="272" fill="#4a453c" font-size="11">confirmation is the channel top</text>
  <text x="262" y="290" fill="#8a7f70" font-size="10">a bottom break or a deep pullback is failure</text>

  <text x="520" y="54" fill="#4a453c" font-size="13">broadening</text>
  <text x="520" y="72" fill="#8a7f70" font-size="11">highs rise, lows fall</text>
  <line x1="524" y1="150" x2="692" y2="78" stroke="#8f3d3a" stroke-width="1.5"/>
  <line x1="524" y1="162" x2="692" y2="236" stroke="#2c5a4c" stroke-width="1.5"/>
  <path d="M534 156 L558 136 L586 186 L618 112 L648 214 L684 86" fill="none" stroke="#4a453c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="520" y="272" fill="#4a453c" font-size="11">the bounds move apart</text>
  <text x="520" y="290" fill="#8a7f70" font-size="10">closer to avoidance than to entry</text>
</svg>
