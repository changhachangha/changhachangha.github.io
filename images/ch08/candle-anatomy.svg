<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 265" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="265" fill="#f7f1e6"/>
  <!-- 양봉 -->
  <line x1="170" y1="40" x2="170" y2="215" stroke="#2c5a4c" stroke-width="2.6"/>
  <rect x="140" y="80" width="60" height="90" fill="#2c5a4c"/>
  <!-- 음봉 -->
  <line x1="510" y1="40" x2="510" y2="215" stroke="#8f3d3a" stroke-width="2.6"/>
  <rect x="480" y="80" width="60" height="90" fill="#8f3d3a"/>
  <!-- 중앙 눈금 -->
  <line x1="212" y1="40" x2="468" y2="40" stroke="#b08948" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="212" y1="80" x2="468" y2="80" stroke="#b08948" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="212" y1="170" x2="468" y2="170" stroke="#b08948" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="212" y1="215" x2="468" y2="215" stroke="#b08948" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="340" y="34" fill="#4a453c" font-size="11" text-anchor="middle">고가 · high</text>
  <text x="340" y="62" fill="#4a453c" font-size="11" text-anchor="middle">윗꼬리 · upper shadow</text>
  <text x="340" y="130" fill="#4a453c" font-size="11" text-anchor="middle">몸통 · real body (시가~종가)</text>
  <text x="340" y="197" fill="#4a453c" font-size="11" text-anchor="middle">아랫꼬리 · lower shadow</text>
  <text x="340" y="240" fill="#4a453c" font-size="11" text-anchor="middle">저가 · low</text>
  <!-- 시가·종가 표기 -->
  <text x="206" y="84" fill="#4a453c" font-size="10.5">종가</text>
  <text x="206" y="174" fill="#4a453c" font-size="10.5">시가</text>
  <text x="474" y="84" fill="#4a453c" font-size="10.5" text-anchor="end">시가</text>
  <text x="474" y="174" fill="#4a453c" font-size="10.5" text-anchor="end">종가</text>
  <text x="170" y="252" fill="#2c5a4c" font-size="11" text-anchor="middle">양봉 · bullish</text>
  <text x="510" y="252" fill="#8f3d3a" font-size="11" text-anchor="middle">음봉 · bearish</text>
</svg>
