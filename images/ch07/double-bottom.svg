<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="270" fill="#f7f1e6"/>
  <text x="24" y="24" font-size="12" fill="#8a7f70" letter-spacing="1">DOUBLE BOTTOM · 이중 바닥 — 중간 고점의 돌파가 확인</text>

  <!-- 넥라인: 두 저점 사이의 중간 고점 -->
  <line x1="150" y1="128" x2="560" y2="128" stroke="#b08948" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="556" y="120" fill="#b08948" font-size="11" text-anchor="end">중간 고점 = 넥라인 · neckline</text>

  <!-- 가격 경로: 하락 → 저점1 → 중간 고점 → 저점2 → 돌파 → 되돌림 → 상승 -->
  <path d="M40 55 L110 140 L175 195 L255 128 L325 193 L395 118 L430 132 L500 85 L600 60 L655 55"
        fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 선행 하락은 하락색 -->
  <path d="M40 55 L110 140 L175 195"
        fill="none" stroke="#8f3d3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 넥라인 돌파 이후는 상승색 -->
  <path d="M395 118 L430 132 L500 85 L600 60 L655 55"
        fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 두 저점 표시 -->
  <circle cx="175" cy="195" r="4" fill="#8f3d3a"/>
  <circle cx="325" cy="193" r="4" fill="#8f3d3a"/>
  <text x="250" y="222" fill="#8f3d3a" font-size="11" text-anchor="middle">같은 저점을 두 번 시험 · two lows</text>
  <circle cx="255" cy="128" r="3.5" fill="#b08948"/>
  <circle cx="395" cy="118" r="4" fill="#2c5a4c"/>

  <!-- 라벨 -->
  <text x="44" y="45" fill="#8f3d3a" font-size="11">선행 하락 · prior downtrend</text>
  <text x="380" y="105" fill="#2c5a4c" font-size="11">확인 돌파 · break</text>
  <text x="424" y="150" fill="#4a453c" font-size="10" opacity="0.85">되돌림 · pullback</text>
  <text x="540" y="48" fill="#2c5a4c" font-size="11">완성 후 상승</text>
</svg>
