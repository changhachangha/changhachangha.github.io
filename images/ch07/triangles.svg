<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="720" height="280" fill="#f7f1e6"/>
  <text x="24" y="24" font-size="12" fill="#8a7f70" letter-spacing="1">TRIANGLES · 삼각 계열 — 기울기는 편향, 돌파가 방향</text>

  <!-- 패널 1: 상승 삼각 (수평 저항 + 높아지는 저점) -->
  <text x="30" y="52" fill="#4a453c" font-size="12" font-weight="600">상승 삼각 · ascending</text>
  <text x="30" y="68" fill="#8a7f70" font-size="10">수평 저항 + 높아지는 저점</text>
  <line x1="30" y1="95" x2="195" y2="95" stroke="#8f3d3a" stroke-width="1.6"/>
  <line x1="30" y1="205" x2="195" y2="140" stroke="#2c5a4c" stroke-width="1.6"/>
  <path d="M40 190 L70 100 L100 160 L130 98 L155 135 L180 95 L195 100"
        fill="none" stroke="#4a453c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M195 100 L212 72" fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M212 72 l-2 8 M212 72 l-8 1" stroke="#2c5a4c" stroke-width="1.4" fill="none"/>

  <!-- 패널 2: 하락 삼각 (낮아지는 고점 + 수평 지지) -->
  <text x="265" y="52" fill="#4a453c" font-size="12" font-weight="600">하락 삼각 · descending</text>
  <text x="265" y="68" fill="#8a7f70" font-size="10">낮아지는 고점 + 수평 지지</text>
  <line x1="265" y1="80" x2="430" y2="150" stroke="#8f3d3a" stroke-width="1.6"/>
  <line x1="265" y1="205" x2="430" y2="205" stroke="#2c5a4c" stroke-width="1.6"/>
  <path d="M275 88 L300 195 L330 118 L360 200 L390 145 L415 202 L430 208"
        fill="none" stroke="#4a453c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M430 208 L448 232" fill="none" stroke="#8f3d3a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M448 232 l-8 -1 M448 232 l-1 -8" stroke="#8f3d3a" stroke-width="1.4" fill="none"/>

  <!-- 패널 3: 대칭 삼각 (수렴) -->
  <text x="500" y="52" fill="#4a453c" font-size="12" font-weight="600">대칭 삼각 · symmetrical</text>
  <text x="500" y="68" fill="#8a7f70" font-size="10">수렴하는 두 추세선 — 방향 없음</text>
  <line x1="500" y1="85" x2="665" y2="150" stroke="#8f3d3a" stroke-width="1.6"/>
  <line x1="500" y1="215" x2="665" y2="155" stroke="#2c5a4c" stroke-width="1.6"/>
  <path d="M510 92 L532 205 L556 112 L580 185 L604 122 L628 170 L650 140 L672 155 L690 132"
        fill="none" stroke="#4a453c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M690 132 l-9 -3 M690 132 l-4 -8" stroke="#4a453c" stroke-width="1.4" fill="none"/>
  <text x="596" y="255" fill="#4a453c" font-size="10" text-anchor="middle" opacity="0.85">어느 쪽으로든 깨질 수 있다</text>
</svg>
