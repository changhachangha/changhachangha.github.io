<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="250" fill="#f7f1e6"/>
  <!-- 주추세 궤적: 잡음이 실린 상승 + 2차 조정 -->
  <path d="M40 210 L60 198 L75 205 L95 188 L110 194 L130 176 L150 182 L170 195 L200 168 L215 176 L230 160 L250 168 L265 150
           L290 165 L310 175 L330 165 L350 172 L370 155 L385 162 L405 140 L420 148 L440 130 L465 145 L485 155 L505 145
           L525 128 L545 136 L565 115 L585 124 L605 100 L625 110 L645 88 L660 96 L678 72"
        fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 주추세 방향 표시 -->
  <path d="M60 235 L640 235" stroke="#b08948" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  <path d="M640 235 l-10 -4 v8 z" fill="#b08948"/>
  <text x="58" y="246" fill="#4a453c" font-size="11" opacity="0.8">주추세 Primary · 수년</text>
  <!-- 2차 조정 구간 -->
  <path d="M265 150 L310 175" stroke="#8f3d3a" stroke-width="1.6" fill="none"/>
  <path d="M440 130 L485 155" stroke="#8f3d3a" stroke-width="1.6" fill="none"/>
  <path d="M287 162 l14 0 m-4 -4 l4 4 l-4 4" stroke="#8f3d3a" stroke-width="1.2" fill="none"/>
  <path d="M462 146 l14 0 m-4 -4 l4 4 l-4 4" stroke="#8f3d3a" stroke-width="1.2" fill="none"/>
  <text x="292" y="196" fill="#8f3d3a" font-size="11">2차 조정 Secondary</text>
  <text x="432" y="182" fill="#8f3d3a" font-size="11">2차 조정</text>
  <text x="292" y="209" fill="#8f3d3a" font-size="10" opacity="0.8">직전 상승분의 1/3~2/3 되돌림</text>
  <!-- 소파동 돋보기 -->
  <rect x="560" y="160" width="120" height="60" fill="none" stroke="#b08948" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M568 205 L578 200 L586 204 L596 197 L604 202 L614 194 L622 199 L632 192 L640 196 L650 188 L660 192 L672 184"
        fill="none" stroke="#4a453c" stroke-width="1.2"/>
  <text x="568" y="176" fill="#4a453c" font-size="10">소파동 Minor · 수일~3주</text>
  <path d="M640 160 L618 132" stroke="#b08948" stroke-width="0.8" stroke-dasharray="2 3"/>
  <!-- 범례 -->
  <text x="40" y="30" fill="#4a453c" font-size="13" font-weight="600">다우의 세 운동 · Three movements of the averages</text>
  <line x1="40" y1="44" x2="72" y2="44" stroke="#2c5a4c" stroke-width="2.4"/>
  <text x="78" y="48" fill="#4a453c" font-size="10.5">주추세를 이루는 가격 궤적</text>
  <line x1="260" y1="44" x2="292" y2="44" stroke="#8f3d3a" stroke-width="1.6"/>
  <text x="298" y="48" fill="#4a453c" font-size="10.5">주추세에 반하는 2차 조정</text>
  <line x1="480" y1="44" x2="512" y2="44" stroke="#4a453c" stroke-width="1.2"/>
  <text x="518" y="48" fill="#4a453c" font-size="10.5">세분된 소파동(돋보기)</text>
</svg>
