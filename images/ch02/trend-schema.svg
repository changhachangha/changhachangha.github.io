<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="240" fill="#f7f1e6"/>
  <!-- 좌: 상승 추세 -->
  <text x="30" y="28" fill="#4a453c" font-size="13" font-weight="600">상승 추세 · Uptrend</text>
  <path d="M40 200 L95 120 L140 155 L195 75 L240 110 L305 30" fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 고점 연결 (상승) -->
  <path d="M95 120 L195 75 L305 30" fill="none" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- 저점 연결 (상승) -->
  <path d="M140 155 L240 110" fill="none" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="95" cy="120" r="3.5" fill="#2c5a4c"/><circle cx="195" cy="75" r="3.5" fill="#2c5a4c"/><circle cx="305" cy="30" r="3.5" fill="#2c5a4c"/>
  <circle cx="140" cy="155" r="3.5" fill="#2c5a4c"/><circle cx="240" cy="110" r="3.5" fill="#2c5a4c"/>
  <text x="80" y="112" fill="#4a453c" font-size="11">HH1</text>
  <text x="180" y="67" fill="#4a453c" font-size="11">HH2</text>
  <text x="288" y="22" fill="#4a453c" font-size="11">HH3</text>
  <text x="124" y="172" fill="#4a453c" font-size="11">HL1</text>
  <text x="226" y="127" fill="#4a453c" font-size="11">HL2</text>
  <!-- 중앙 구분선 -->
  <line x1="350" y1="20" x2="350" y2="220" stroke="#b08948" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
  <!-- 우: 하락 추세 -->
  <text x="380" y="28" fill="#4a453c" font-size="13" font-weight="600">하락 추세 · Downtrend</text>
  <path d="M390 40 L445 130 L490 95 L545 175 L590 140 L655 215" fill="none" stroke="#8f3d3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 고점 연결 (하락) -->
  <path d="M390 40 L490 95 L590 140" fill="none" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- 저점 연결 (하락) -->
  <path d="M445 130 L545 175 L655 215" fill="none" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="490" cy="95" r="3.5" fill="#8f3d3a"/><circle cx="590" cy="140" r="3.5" fill="#8f3d3a"/>
  <circle cx="445" cy="130" r="3.5" fill="#8f3d3a"/><circle cx="545" cy="175" r="3.5" fill="#8f3d3a"/><circle cx="655" cy="215" r="3.5" fill="#8f3d3a"/>
  <text x="476" y="88" fill="#4a453c" font-size="11">LH1</text>
  <text x="576" y="133" fill="#4a453c" font-size="11">LH2</text>
  <text x="430" y="147" fill="#4a453c" font-size="11">LL1</text>
  <text x="530" y="192" fill="#4a453c" font-size="11">LL2</text>
  <text x="638" y="232" fill="#4a453c" font-size="11">LL3</text>
  <text x="30" y="228" fill="#4a453c" font-size="11" opacity="0.75">고점·저점이 함께 높아짐 (HH + HL)</text>
  <text x="380" y="228" fill="#4a453c" font-size="11" opacity="0.75">고점·저점이 함께 낮아짐 (LH + LL)</text>
</svg>
