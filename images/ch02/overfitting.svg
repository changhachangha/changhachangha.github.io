<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="240" fill="#f7f1e6"/>
  <!-- 축 -->
  <line x1="45" y1="30" x2="45" y2="200" stroke="#4a453c" stroke-width="1"/>
  <line x1="45" y1="200" x2="670" y2="200" stroke="#4a453c" stroke-width="1"/>
  <!-- 검증 경계 -->
  <line x1="430" y1="30" x2="430" y2="200" stroke="#b08948" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="430" y="20" fill="#4a453c" font-size="11" text-anchor="middle">검증 경계 · fit boundary</text>
  <!-- 인샘플 구간: 파라미터가 맞춰진 부드러운 우상향 -->
  <path d="M55 190 C120 178, 170 150, 225 128 S330 82, 425 62" fill="none" stroke="#2c5a4c" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 아웃오브샘플: 같은 규칙이 흔들리며 하강 -->
  <path d="M425 62 L452 82 L478 70 L502 96 L528 84 L552 110 L578 100 L604 124 L632 114 L658 132" fill="none" stroke="#8f3d3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="70" y="55" fill="#4a453c" font-size="13" font-weight="600">인샘플 in-sample</text>
  <text x="70" y="73" fill="#4a453c" font-size="11" opacity="0.8">파라미터를 여기에 맞춤 — 어떤 규칙도 예뻐진다</text>
  <text x="455" y="55" fill="#4a453c" font-size="13" font-weight="600">아웃오브샘플 out-of-sample</text>
  <text x="455" y="73" fill="#4a453c" font-size="11" opacity="0.8">미래 데이터 — 같은 규칙이 깨진다</text>
  <text x="660" y="218" fill="#4a453c" font-size="10" text-anchor="end" opacity="0.7">시간 →</text>
  <text x="28" y="140" fill="#4a453c" font-size="10" opacity="0.7" transform="rotate(-90 28 140)">누적 수익</text>
</svg>
