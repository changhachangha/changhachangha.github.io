<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="240" fill="#f7f1e6"/>
  <!-- 좌 패널: 삼각수렴 해석 -->
  <text x="30" y="28" fill="#4a453c" font-size="13" font-weight="600">해석 A · 삼각수렴 Triangle</text>
  <!-- 수렴 추세선 -->
  <line x1="30" y1="62" x2="300" y2="82" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="55" y1="160" x2="295" y2="130" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- 가격 경로 -->
  <path d="M40 70 L85 150 L130 80 L175 135 L220 72 L265 145" fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="40" cy="70" r="3" fill="#4a453c"/><circle cx="130" cy="80" r="3" fill="#4a453c"/><circle cx="220" cy="72" r="3" fill="#4a453c"/>
  <circle cx="85" cy="150" r="3" fill="#4a453c"/><circle cx="175" cy="135" r="3" fill="#4a453c"/><circle cx="265" cy="145" r="3" fill="#4a453c"/>
  <text x="30" y="215" fill="#4a453c" font-size="11" opacity="0.8">"수렴 후 돌파가 남았다"</text>
  <!-- 중앙 구분선 -->
  <line x1="350" y1="20" x2="350" y2="220" stroke="#b08948" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
  <!-- 우 패널: 횡보 해석 (같은 경로) -->
  <text x="380" y="28" fill="#4a453c" font-size="13" font-weight="600">해석 B · 횡보 Range</text>
  <!-- 수평 지지·저항 -->
  <line x1="380" y1="66" x2="660" y2="66" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="380" y1="152" x2="660" y2="152" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="640" y="60" fill="#4a453c" font-size="10" text-anchor="end">저항</text>
  <text x="640" y="166" fill="#4a453c" font-size="10" text-anchor="end">지지</text>
  <!-- 같은 가격 경로 (x+350) -->
  <path d="M390 70 L435 150 L480 80 L525 135 L570 72 L615 145" fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="390" cy="70" r="3" fill="#4a453c"/><circle cx="480" cy="80" r="3" fill="#4a453c"/><circle cx="570" cy="72" r="3" fill="#4a453c"/>
  <circle cx="435" cy="150" r="3" fill="#4a453c"/><circle cx="525" cy="135" r="3" fill="#4a453c"/><circle cx="615" cy="145" r="3" fill="#4a453c"/>
  <text x="380" y="215" fill="#4a453c" font-size="11" opacity="0.8">"상하단 사이를 왕복한다"</text>
</svg>
