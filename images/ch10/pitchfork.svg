<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="260" fill="#f7f1e6"/>
  <!-- 피벗 P0-P1-P2와 P1P2의 중점 M -->
  <circle cx="60" cy="230" r="4" fill="#4a453c"/>
  <circle cx="230" cy="110" r="4" fill="#4a453c"/>
  <circle cx="370" cy="175" r="4" fill="#4a453c"/>
  <circle cx="300" cy="142" r="3" fill="#b08948"/>
  <line x1="230" y1="110" x2="370" y2="175" stroke="#b08948" stroke-width="1" stroke-dasharray="3 4" opacity="0.8"/>
  <!-- 삼지창: 중앙값선 + 평행선 -->
  <line x1="60" y1="230" x2="660" y2="11" stroke="#b08948" stroke-width="1.8"/>
  <line x1="230" y1="110" x2="520" y2="4" stroke="#8f3d3a" stroke-width="1.2" stroke-dasharray="7 4"/>
  <line x1="370" y1="175" x2="660" y2="69" stroke="#2c5a4c" stroke-width="1.2" stroke-dasharray="7 4"/>
  <!-- 가격 경로: P0→P1→P2 이후 중앙값선 회귀 -->
  <path d="M60 230 L230 110 L370 175 L478 78 L560 140 L640 95" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="478" cy="78" r="3.5" fill="#b08948"/>
  <!-- 라벨 -->
  <text x="46" y="248" fill="#4a453c" font-size="11" font-weight="600">P0</text>
  <text x="238" y="104" fill="#4a453c" font-size="11" font-weight="600">P1</text>
  <text x="380" y="193" fill="#4a453c" font-size="11" font-weight="600">P2</text>
  <text x="308" y="158" fill="#b08948" font-size="10">M = P1–P2 중점</text>
  <text x="470" y="52" fill="#b08948" font-size="11" font-weight="600">중앙값선 median line</text>
  <text x="392" y="32" fill="#8f3d3a" font-size="10">상단 평행선</text>
  <text x="540" y="100" fill="#2c5a4c" font-size="10">하단 평행선</text>
</svg>
