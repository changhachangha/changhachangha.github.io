<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="260" fill="#f7f1e6"/>
  <!-- 되돌림 격자: 스윙 고점(y=45)에서 저점(y=210)으로 -->
  <line x1="60" y1="45" x2="620" y2="45" stroke="#4a453c" stroke-width="1.4"/>
  <line x1="60" y1="84" x2="620" y2="84" stroke="#b08948" stroke-width="1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="60" y1="108" x2="620" y2="108" stroke="#b08948" stroke-width="1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="60" y1="128" x2="620" y2="128" stroke="#b08948" stroke-width="1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="60" y1="147" x2="620" y2="147" stroke="#8f3d3a" stroke-width="1.6"/>
  <line x1="60" y1="175" x2="620" y2="175" stroke="#b08948" stroke-width="1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="60" y1="210" x2="620" y2="210" stroke="#4a453c" stroke-width="1.4"/>
  <!-- 깊은 되돌림 밴드 표시(0.618~0.786) -->
  <rect x="60" y="147" width="560" height="28" fill="#8f3d3a" opacity="0.06"/>
  <!-- 가격 경로: 저점 → 고점 → 0.618 되돌림 → 재상승 -->
  <path d="M62 210 L140 152 L218 86 L300 45 L360 92 L430 147 L500 108 L578 68 L636 52" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="430" cy="147" r="3.5" fill="#8f3d3a"/>
  <!-- 라벨 -->
  <text x="68" y="40" fill="#4a453c" font-size="11">스윙 고점 · swing high</text>
  <text x="68" y="224" fill="#4a453c" font-size="11">스윙 저점 · swing low</text>
  <text x="628" y="88" fill="#4a453c" font-size="11">23.6</text>
  <text x="628" y="112" fill="#4a453c" font-size="11">38.2</text>
  <text x="628" y="132" fill="#4a453c" font-size="11">50 관용</text>
  <text x="628" y="151" fill="#8f3d3a" font-size="11" font-weight="600">61.8</text>
  <text x="628" y="179" fill="#4a453c" font-size="11">78.6</text>
  <text x="90" y="164" fill="#8f3d3a" font-size="11" font-weight="600">깊은 되돌림 구간 0.618–0.786</text>
</svg>
