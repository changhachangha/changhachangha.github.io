<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="280" fill="#f7f1e6"/>
  <!-- 오더블록 존: 마지막 하락봉의 범위 -->
  <rect x="225" y="160" width="440" height="55" fill="#8f3d3a" opacity="0.12"/>
  <line x1="225" y1="160" x2="665" y2="160" stroke="#8f3d3a" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="225" y1="215" x2="665" y2="215" stroke="#8f3d3a" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- 하락 봉들 -->
  <line x1="100" y1="55" x2="100" y2="105" stroke="#8f3d3a" stroke-width="1.6"/>
  <rect x="80" y="65" width="40" height="30" fill="#8f3d3a"/>
  <line x1="155" y1="92" x2="155" y2="140" stroke="#8f3d3a" stroke-width="1.6"/>
  <rect x="135" y="102" width="40" height="28" fill="#8f3d3a"/>
  <line x1="210" y1="128" x2="210" y2="175" stroke="#8f3d3a" stroke-width="1.6"/>
  <rect x="190" y="138" width="40" height="28" fill="#8f3d3a"/>
  <!-- 마지막 하락봉 = 오더블록 -->
  <line x1="265" y1="160" x2="265" y2="215" stroke="#8f3d3a" stroke-width="1.6"/>
  <rect x="245" y="170" width="40" height="35" fill="#8f3d3a"/>
  <!-- 변위 상승 봉들 -->
  <line x1="320" y1="135" x2="320" y2="200" stroke="#2c5a4c" stroke-width="1.6"/>
  <rect x="300" y="145" width="40" height="45" fill="#2c5a4c"/>
  <line x1="375" y1="70" x2="375" y2="140" stroke="#2c5a4c" stroke-width="1.6"/>
  <rect x="355" y="80" width="40" height="50" fill="#2c5a4c"/>
  <line x1="430" y1="25" x2="430" y2="75" stroke="#2c5a4c" stroke-width="1.6"/>
  <rect x="410" y="32" width="40" height="35" fill="#2c5a4c"/>
  <!-- 재방문 -->
  <line x1="510" y1="45" x2="510" y2="150" stroke="#8f3d3a" stroke-width="1.6"/>
  <rect x="490" y="55" width="40" height="85" fill="#8f3d3a"/>
  <line x1="565" y1="135" x2="565" y2="195" stroke="#8f3d3a" stroke-width="1.6"/>
  <rect x="545" y="145" width="40" height="40" fill="#8f3d3a" opacity="0.8"/>
  <!-- 재상승 -->
  <line x1="620" y1="110" x2="620" y2="190" stroke="#2c5a4c" stroke-width="1.6"/>
  <rect x="600" y="120" width="40" height="60" fill="#2c5a4c"/>
  <!-- 라벨 -->
  <text x="290" y="212" fill="#4a453c" font-size="11">오더블록 · order block — 변위 직전 마지막 하락봉</text>
  <text x="340" y="52" fill="#2c5a4c" font-size="11">변위 · displacement</text>
  <line x1="342" y1="56" x2="368" y2="76" stroke="#2c5a4c" stroke-width="0.8" opacity="0.5"/>
  <text x="536" y="238" fill="#4a453c" font-size="11" opacity="0.8">존 재방문 · revisit</text>
</svg>
