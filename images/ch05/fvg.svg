<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="250" fill="#f7f1e6"/>
  <!-- FVG 존: 첫째 봉 고가(y=112)와 셋째 봉 저가(y=86) 사이 -->
  <rect x="250" y="86" width="390" height="26" fill="#b08948" opacity="0.18"/>
  <line x1="250" y1="112" x2="640" y2="112" stroke="#b08948" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="380" y1="86" x2="640" y2="86" stroke="#b08948" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="470" y="103" fill="#4a453c" font-size="11">FVG · 불균형 갭 — 첫째 고가와 셋째 저가가 안 겹침</text>
  <!-- 첫째 봉 (하락) -->
  <line x1="227" y1="112" x2="227" y2="168" stroke="#8f3d3a" stroke-width="1.6"/>
  <rect x="205" y="122" width="44" height="30" fill="#8f3d3a"/>
  <!-- 둘째 봉 (변위) -->
  <line x1="297" y1="50" x2="297" y2="126" stroke="#2c5a4c" stroke-width="1.6"/>
  <rect x="275" y="60" width="44" height="58" fill="#2c5a4c"/>
  <!-- 셋째 봉 (상승) -->
  <line x1="367" y1="28" x2="367" y2="86" stroke="#2c5a4c" stroke-width="1.6"/>
  <rect x="345" y="38" width="44" height="40" fill="#2c5a4c"/>
  <!-- 재방문 봉 -->
  <line x1="570" y1="42" x2="570" y2="98" stroke="#8f3d3a" stroke-width="1.6"/>
  <rect x="548" y="52" width="44" height="34" fill="#8f3d3a" opacity="0.75"/>
  <text x="524" y="126" fill="#4a453c" font-size="10" opacity="0.8">갭 재방문</text>
  <!-- 라벨 -->
  <text x="205" y="188" fill="#4a453c" font-size="11">첫째</text>
  <text x="275" y="188" fill="#4a453c" font-size="11">둘째 · 변위</text>
  <text x="345" y="188" fill="#4a453c" font-size="11">셋째</text>
  <text x="48" y="114" fill="#4a453c" font-size="11">첫째 봉 고가</text>
  <line x1="48" y1="118" x2="205" y2="112" stroke="#4a453c" stroke-width="0.8" opacity="0.5"/>
  <text x="392" y="34" fill="#4a453c" font-size="11">셋째 봉 저가</text>
  <line x1="392" y1="40" x2="372" y2="82" stroke="#4a453c" stroke-width="0.8" opacity="0.5"/>
</svg>
