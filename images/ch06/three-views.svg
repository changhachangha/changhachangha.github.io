<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="340" fill="#f7f1e6"/>

  <!-- 패널 1: 라인 -->
  <text x="40" y="20" fill="#4a453c" font-size="12" font-weight="600">라인 · line — 고저·시가를 버리고 종가만 잇는다</text>
  <path d="M60 60 L120 78 L180 52 L240 40 L300 70 L360 84 L420 58 L480 44 L540 62" fill="none" stroke="#4a453c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="3" fill="#2c5a4c"/><circle cx="120" cy="78" r="3" fill="#2c5a4c"/>
  <circle cx="180" cy="52" r="3" fill="#2c5a4c"/><circle cx="240" cy="40" r="3" fill="#2c5a4c"/>
  <circle cx="300" cy="70" r="3" fill="#2c5a4c"/><circle cx="360" cy="84" r="3" fill="#2c5a4c"/>
  <circle cx="420" cy="58" r="3" fill="#2c5a4c"/><circle cx="480" cy="44" r="3" fill="#2c5a4c"/>
  <circle cx="540" cy="62" r="3" fill="#2c5a4c"/>
  <text x="560" y="90" fill="#8a7f70" font-size="11">종가만 남음 · closes only</text>
  <line x1="40" y1="106" x2="660" y2="106" stroke="#b08948" stroke-width="0.8" stroke-dasharray="3 4"/>

  <!-- 패널 2: 캔들 -->
  <text x="40" y="128" fill="#4a453c" font-size="12" font-weight="600">캔들 · candle — OHLC를 다 남기고 몸통·꼬리로 강조</text>
  <!-- c1 up -->
  <line x1="60" y1="150" x2="60" y2="188" stroke="#2c5a4c" stroke-width="1.4"/>
