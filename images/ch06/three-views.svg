  <line x1="40" y1="212" x2="660" y2="212" stroke="#b08948" stroke-width="0.8" stroke-dasharray="3 4"/>

  <!-- 패널 3: 렌코 -->
  <text x="40" y="234" fill="#4a453c" font-size="12" font-weight="600">렌코 · renko — 정한 폭만큼 움직여야 새 벽돌, 시간을 버림</text>
  <!-- up bricks: hollow green / down bricks: filled dark red, h=14 w=26 -->
