<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="280" fill="#f7f1e6"/>

  <text x="40" y="26" fill="#4a453c" font-size="12" font-weight="600">P&amp;F · point and figure — 시간축 없이 X·O 열만 쌓는다</text>

  <!-- 횡보 구간 카운트 박스 (열 2~6) -->
  <rect x="109" y="100" width="90" height="113" fill="none" stroke="#b08948" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="100" y="230" fill="#b08948" font-size="11">원인 · cause — 횡보의 칸수를 가로로 센다</text>

  <!-- X·O 열 -->
  <g font-size="13" text-anchor="middle" font-weight="600">
    <!-- c1 X -->
    <g fill="#2c5a4c">
      <text x="100" y="208">X</text><text x="100" y="192">X</text><text x="100" y="176">X</text><text x="100" y="160">X</text>
    </g>
    <!-- c2 O -->
    <g fill="#8f3d3a">
      <text x="118" y="176">O</text><text x="118" y="192">O</text><text x="118" y="208">O</text>
    </g>
    <!-- c3 X -->
    <g fill="#2c5a4c">
      <text x="136" y="192">X</text><text x="136" y="176">X</text><text x="136" y="160">X</text><text x="136" y="144">X</text><text x="136" y="128">X</text>
    </g>
    <!-- c4 O -->
    <g fill="#8f3d3a">
      <text x="154" y="144">O</text><text x="154" y="160">O</text><text x="154" y="176">O</text><text x="154" y="192">O</text><text x="154" y="208">O</text>
    </g>
    <!-- c5 X -->
    <g fill="#2c5a4c">
      <text x="172" y="192">X</text><text x="172" y="176">X</text><text x="172" y="160">X</text><text x="172" y="144">X</text><text x="172" y="128">X</text><text x="172" y="112">X</text>
    </g>
    <!-- c6 O -->
    <g fill="#8f3d3a">
      <text x="190" y="128">O</text><text x="190" y="144">O</text><text x="190" y="160">O</text><text x="190" y="176">O</text><text x="190" y="192">O</text>
    </g>
    <!-- c7 X 돌파 -->
    <g fill="#2c5a4c">
      <text x="208" y="176">X</text><text x="208" y="160">X</text><text x="208" y="144">X</text><text x="208" y="128">X</text><text x="208" y="112">X</text><text x="208" y="96">X</text><text x="208" y="80">X</text>
    </g>
    <!-- c8 O -->
    <g fill="#8f3d3a">
      <text x="226" y="96">O</text><text x="226" y="112">O</text><text x="226" y="128">O</text>
    </g>
    <!-- c9 X -->
    <g fill="#2c5a4c">
      <text x="244" y="112">X</text><text x="244" y="96">X</text><text x="244" y="80">X</text><text x="244" y="64">X</text>
    </g>
  </g>

  <!-- 결과 투사 화살표 -->
  <line x1="320" y1="204" x2="320" y2="76" stroke="#4a453c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M320 70 L314 82 L326 82 Z" fill="#4a453c"/>
  <text x="334" y="120" fill="#4a453c" font-size="11.5">결과 · effect — 목표폭 투사</text>
  <text x="334" y="138" fill="#8a7f70" font-size="10.5">목표폭 = 칸수 × 박스 × 전환</text>
  <text x="334" y="156" fill="#8a7f70" font-size="10.5">count × box × reversal</text>

  <!-- 범례 -->
  <text x="40" y="258" fill="#4a453c" font-size="11">X = 상승열 rising · O = 하락열 falling · 박스 box = 한 칸의 가격 폭 · 3칸 역행 시 열 교체</text>
</svg>
