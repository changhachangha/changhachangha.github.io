<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="340" fill="#f7f1e6"/>

  <!-- 왼쪽: 실제 봉 -->
  <text x="60" y="26" fill="#4a453c" font-size="12" font-weight="600">real OHLC</text>
  <!-- r1 up: O100 H120 L90 C115 -->
  <line x1="80" y1="100" x2="80" y2="220" stroke="#2c5a4c" stroke-width="1.4"/>
  <rect x="70" y="120" width="20" height="60" fill="#2c5a4c"/>
  <!-- r2 down: O118 H122 L100 C104 -->
  <line x1="140" y1="92" x2="140" y2="180" stroke="#8f3d3a" stroke-width="1.4"/>
  <rect x="130" y="108" width="20" height="56" fill="#8f3d3a"/>
  <!-- r3 up: O105 H130 L102 C128 -->
  <line x1="200" y1="60" x2="200" y2="172" stroke="#2c5a4c" stroke-width="1.4"/>
  <rect x="190" y="68" width="20" height="92" fill="#2c5a4c"/>
  <!-- r4 down: O130 H132 L110 C114 -->
  <line x1="260" y1="52" x2="260" y2="140" stroke="#8f3d3a" stroke-width="1.4"/>
  <rect x="250" y="60" width="20" height="64" fill="#8f3d3a"/>
  <text x="242" y="240" fill="#8f3d3a" font-size="11">the real bar is down</text>

  <!-- 변환 화살표 -->
  <line x1="300" y1="140" x2="368" y2="140" stroke="#b08948" stroke-width="1.6"/>
  <path d="M368 140 L358 134 L358 146 Z" fill="#b08948"/>
  <text x="296" y="126" fill="#b08948" font-size="11">recomputed</text>

  <!-- 오른쪽: 하이킨아시 -->
  <text x="410" y="26" fill="#4a453c" font-size="12" font-weight="600">heikin-ashi</text>
  <!-- h1: HA O107.5 C106.3 H120 L90 -->
  <line x1="420" y1="100" x2="420" y2="220" stroke="#8f3d3a" stroke-width="1.4"/>
  <rect x="410" y="150" width="20" height="5" fill="#8f3d3a"/>
  <!-- h2: O106.9 C111 H122 L100 -->
  <line x1="480" y1="92" x2="480" y2="180" stroke="#2c5a4c" stroke-width="1.4"/>
  <rect x="470" y="136" width="20" height="16" fill="#2c5a4c"/>
  <!-- h3: O108.9 C116.3 H130 L102 -->
  <line x1="540" y1="60" x2="540" y2="172" stroke="#2c5a4c" stroke-width="1.4"/>
  <rect x="530" y="115" width="20" height="29" fill="#2c5a4c"/>
  <!-- h4: O112.6 C121.5 H132 L110 -->
  <line x1="600" y1="52" x2="600" y2="140" stroke="#2c5a4c" stroke-width="1.4"/>
  <rect x="590" y="94" width="20" height="36" fill="#2c5a4c"/>
  <text x="582" y="240" fill="#2c5a4c" font-size="11">the HA bar is up</text>
  <line x1="266" y1="240" x2="578" y2="240" stroke="#b08948" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="330" y="255" fill="#4a453c" font-size="11">same data, different candles</text>

  <!-- 공식 -->
  <text x="60" y="286" fill="#4a453c" font-size="11.5">HA close = (open+high+low+close) ÷ 4   ·   HA open = (prior HA open + prior HA close) ÷ 2</text>
  <text x="60" y="306" fill="#4a453c" font-size="11.5">HA high = max(high, HA open, HA close)   ·   HA low = min(low, HA open, HA close)</text>
  <text x="60" y="326" fill="#8f3d3a" font-size="11.5">the displayed open and close may never have traded — orders use the real quote</text>
</svg>
