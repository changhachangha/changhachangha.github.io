<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="330" fill="#f7f1e6"/>

  <text x="40" y="28" fill="#4a453c" font-size="12" font-weight="600">RSI 다이버전스 — 가격은 고점을 높이는데 모멘텀은 못 따라간다</text>

  <!-- ===== 위 패널: 가격 ===== -->
  <text x="48" y="56" fill="#8a7f70" font-size="10.5">가격 price</text>
  <!-- 가격선: 저점-고점1-되돌림-고점2(더 높음) -->
  <polyline points="60,140 120,118 170,128 230,96 300,104 360,72 430,80 490,58"
            fill="none" stroke="#4a453c" stroke-width="2"/>
  <!-- 고점 두 개를 잇는 상승 점선 -->
  <line x1="230" y1="96" x2="490" y2="58" stroke="#8f3d3a" stroke-width="1.4" stroke-dasharray="5,4"/>
  <circle cx="230" cy="96" r="3.2" fill="#8f3d3a"/>
  <circle cx="490" cy="58" r="3.2" fill="#8f3d3a"/>
  <text x="500" y="52" fill="#8f3d3a" font-size="11">고점 ↑ HH — 가격은 신고가</text>
  <!-- 되돌림 저점 -->
  <circle cx="430" cy="80" r="2.6" fill="#4a453c"/>
  <text x="418" y="98" fill="#8a7f70" font-size="9.5">되돌림 저점</text>

  <!-- 패널 구분선 -->
  <line x1="40" y1="176" x2="660" y2="176" stroke="#8a7f70" stroke-width="0.8" stroke-dasharray="2,3"/>

  <!-- ===== 아래 패널: RSI ===== -->
  <text x="48" y="200" fill="#8a7f70" font-size="10.5">RSI (14)</text>
  <!-- 70 / 30 경계선 -->
  <line x1="60" y1="212" x2="660" y2="212" stroke="#b08948" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="292" x2="660" y2="292" stroke="#b08948" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="664" y="216" fill="#b08948" font-size="9.5">70</text>
  <text x="664" y="296" fill="#b08948" font-size="9.5">30</text>
  <!-- RSI선: 고점1은 70 위, 고점2는 더 낮음 -->
  <polyline points="60,268 120,232 170,246 230,204 300,224 360,238 430,252 490,236"
            fill="none" stroke="#2c5a4c" stroke-width="2"/>
  <!-- RSI 고점 두 개를 잇는 하락 점선 -->
  <line x1="230" y1="204" x2="490" y2="236" stroke="#8f3d3a" stroke-width="1.4" stroke-dasharray="5,4"/>
  <circle cx="230" cy="204" r="3.2" fill="#8f3d3a"/>
  <circle cx="490" cy="236" r="3.2" fill="#8f3d3a"/>
  <text x="500" y="240" fill="#8f3d3a" font-size="11">RSI 고점 ↓ LH — 모멘텀은 약해짐</text>
  <text x="240" y="196" fill="#8a7f70" font-size="9.5">첫 고점은 과매수권</text>

  <!-- 정렬 보조선 -->
  <line x1="230" y1="100" x2="230" y2="200" stroke="#8f3d3a" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.6"/>
  <line x1="490" y1="62" x2="490" y2="232" stroke="#8f3d3a" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.6"/>

  <text x="40" y="322" fill="#4a453c" font-size="11">가격의 고점은 올라가는데 RSI의 고점은 낮아진다 — 경고지 트리거가 아니다 · bearish divergence</text>
</svg>
