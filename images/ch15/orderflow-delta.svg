<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="300" fill="#f7f1e6"/>
  <text x="24" y="26" font-size="12" fill="#8a7f70" letter-spacing="1">ORDER FLOW · FOOTPRINT — 봉을 가격대별 체결로 쪼갠다</text>

  <!-- 왼쪽: 보통 봉 -->
  <line x1="86" y1="72" x2="86" y2="200" stroke="#2c5a4c" stroke-width="2"/>
  <rect x="74" y="98" width="24" height="66" fill="#2c5a4c"/>
  <text x="66" y="222" font-size="11" fill="#4a453c">한 봉</text>
  <path d="M110 140 L150 140" stroke="#b08948" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b08948"/>
    </marker>
  </defs>

  <!-- 중앙: 풋프린트 사다리 -->
  <text x="166" y="62" font-size="10" fill="#8a7f70">가격</text>
  <text x="222" y="62" font-size="10" fill="#8a7f70">매도 bid</text>
  <text x="296" y="62" font-size="10" fill="#8a7f70">매수 ask</text>
  <text x="392" y="62" font-size="10" fill="#8a7f70">Δ 델타</text>
  <g font-size="11" fill="#4a453c">
    <text x="166" y="82">103.50</text><text x="230" y="82">14</text><text x="302" y="82">31</text>
    <text x="166" y="106">103.25</text><text x="230" y="106">22</text><text x="302" y="106">47</text>
    <text x="166" y="130">103.00</text><text x="230" y="130">58</text><text x="302" y="130">60</text>
    <text x="166" y="154">102.75</text><text x="230" y="154">71</text><text x="302" y="154">44</text>
    <text x="166" y="178">102.50</text><text x="230" y="178">83</text><text x="302" y="178">39</text>
    <text x="166" y="202">102.25</text><text x="230" y="202">49</text><text x="302" y="202">18</text>
  </g>
  <g stroke="#b08948" stroke-width="0.8" opacity="0.5">
    <line x1="160" y1="88" x2="470" y2="88"/>
    <line x1="160" y1="112" x2="470" y2="112"/>
    <line x1="160" y1="136" x2="470" y2="136"/>
    <line x1="160" y1="160" x2="470" y2="160"/>
    <line x1="160" y1="184" x2="470" y2="184"/>
  </g>
  <!-- 델타 막대: 중심축 x=400 -->
  <line x1="400" y1="66" x2="400" y2="208" stroke="#4a453c" stroke-width="1"/>
  <rect x="400" y="70" width="34" height="14" fill="#2c5a4c"/>
  <rect x="400" y="94" width="50" height="14" fill="#2c5a4c"/>
  <rect x="400" y="118" width="4" height="14" fill="#2c5a4c"/>
  <rect x="346" y="142" width="54" height="14" fill="#8f3d3a"/>
  <rect x="312" y="166" width="88" height="14" fill="#8f3d3a"/>
  <rect x="338" y="190" width="62" height="14" fill="#8f3d3a"/>
  <text x="440" y="82" font-size="10" fill="#2c5a4c">+17</text>
  <text x="456" y="106" font-size="10" fill="#2c5a4c">+25</text>
  <text x="410" y="130" font-size="10" fill="#2c5a4c">+2</text>
  <text x="318" y="154" font-size="10" fill="#8f3d3a">−27</text>
  <text x="284" y="178" font-size="10" fill="#8f3d3a">−44</text>
  <text x="310" y="202" font-size="10" fill="#8f3d3a">−31</text>

  <!-- 오른쪽: CVD 다이버전스 미니 패널 -->
  <text x="506" y="62" font-size="10" fill="#8a7f70">가격 price</text>
  <path d="M506 120 L540 96 L574 106 L608 84 L660 74" fill="none" stroke="#4a453c" stroke-width="1.8"/>
  <circle cx="608" cy="84" r="2.5" fill="#4a453c"/><circle cx="660" cy="74" r="2.5" fill="#4a453c"/>
  <text x="612" y="64" font-size="10" fill="#4a453c">신고가 HH</text>

  <text x="506" y="176" font-size="10" fill="#8a7f70">CVD 누적 델타</text>
  <path d="M506 250 L540 210 L574 224 L608 214 L660 218" fill="none" stroke="#b08948" stroke-width="1.8"/>
  <circle cx="608" cy="214" r="2.5" fill="#b08948"/><circle cx="660" cy="218" r="2.5" fill="#b08948"/>
  <text x="586" y="248" font-size="10" fill="#8f3d3a">고점이 낮아짐 LH</text>
  <text x="506" y="284" font-size="10" fill="#4a453c">가격은 신고가, CVD는 못 미침 → 흡수 경고</text>
</svg>
