<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="300" fill="#f7f1e6"/>
  <text x="24" y="26" font-size="12" fill="#8a7f70" letter-spacing="1">VSA · BAR ANATOMY — spread × volume × close location</text>
  <text x="24" y="48" font-size="11" fill="#4a453c">spread = high-to-low range · volume = the bar below · close location = where the body ends</text>

  <!-- 거래량 기준선 -->
  <line x1="60" y1="250" x2="640" y2="250" stroke="#4a453c" stroke-width="1"/>

  <!-- 1) No Demand — 좁은 스프레드, 낮은 거래량, 상승 봉 -->
  <line x1="130" y1="104" x2="130" y2="166" stroke="#2c5a4c" stroke-width="2"/>
  <rect x="118" y="120" width="24" height="30" fill="#2c5a4c"/>
  <rect x="118" y="238" width="24" height="12" fill="#b08948"/>
  <text x="98" y="190" font-size="10" fill="#8a7f70">narrow spread</text>
  <text x="82" y="296" font-size="12" fill="#4a453c" font-weight="600">No Demand</text>
  <text x="90" y="268" font-size="10" fill="#8a7f70">below-average volume</text>

  <!-- 2) Stopping Volume — 넓은 하락 봉, 최고 거래량, 종가는 저가 위 -->
  <line x1="350" y1="66" x2="350" y2="186" stroke="#8f3d3a" stroke-width="2"/>
  <rect x="338" y="76" width="24" height="84" fill="#8f3d3a"/>
  <rect x="338" y="205" width="24" height="45" fill="#b08948"/>
  <text x="296" y="60" font-size="10" fill="#8a7f70">wide spread (down)</text>
  <text x="374" y="172" font-size="10" fill="#8a7f70">close off the low</text>
  <text x="290" y="296" font-size="12" fill="#4a453c" font-weight="600">Stopping Volume</text>
  <text x="302" y="268" font-size="10" fill="#8a7f70">highest volume of the range</text>

  <!-- 3) Upthrust — 저항 위를 찌르고 하단에 닫힘 -->
  <line x1="512" y1="90" x2="636" y2="90" stroke="#b08948" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="540" y="84" font-size="10" fill="#8a7f70">resistance</text>
  <line x1="570" y1="50" x2="570" y2="142" stroke="#8f3d3a" stroke-width="2"/>
  <rect x="558" y="112" width="24" height="22" fill="#8f3d3a"/>
  <rect x="558" y="215" width="24" height="35" fill="#b08948"/>
  <text x="594" y="56" font-size="10" fill="#8a7f70">pokes above resistance</text>
  <text x="594" y="150" font-size="10" fill="#8a7f70">close at the bar low</text>
  <text x="540" y="296" font-size="12" fill="#4a453c" font-weight="600">Upthrust</text>
  <text x="538" y="268" font-size="10" fill="#8a7f70">with heavy volume</text>
</svg>
