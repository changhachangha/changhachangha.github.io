<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="720" height="280" fill="#f7f1e6"/>
  <text x="24" y="24" font-size="12" fill="#8a7f70" letter-spacing="1">같은 문법, 다른 비율 · SAME GRAMMAR, DIFFERENT RATIOS</text>

  <!-- 패널 구분선 -->
  <line x1="255" y1="40" x2="255" y2="252" stroke="#b08948" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
  <line x1="495" y1="40" x2="495" y2="252" stroke="#b08948" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>

  <!-- 패널 1: 가르틀리 -->
  <text x="35" y="50" fill="#4a453c" font-size="13" font-weight="600">가르틀리 · Gartley</text>
  <path d="M35 205 L95 70 L145 148 L190 105 L228 172" fill="none" stroke="#4a453c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="35" y1="205" x2="228" y2="205" stroke="#4a453c" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
  <g fill="#4a453c">
    <circle cx="35" cy="205" r="3.4"/><circle cx="95" cy="70" r="3.4"/>
    <circle cx="145" cy="148" r="3.4"/><circle cx="190" cy="105" r="3.4"/>
  </g>
  <circle cx="228" cy="172" r="4" fill="#8f3d3a"/>
  <text x="26" y="222" fill="#4a453c" font-size="11">X</text>
  <text x="90" y="60" fill="#4a453c" font-size="11">A</text>
  <text x="138" y="166" fill="#4a453c" font-size="11">B≈0.618</text>
  <text x="182" y="94" fill="#4a453c" font-size="11">C</text>
  <text x="196" y="192" fill="#8f3d3a" font-size="11">D≈0.786</text>
  <text x="35" y="246" fill="#4a453c" font-size="11" opacity="0.8">내부 되돌림 — D가 X 안에 머문다</text>

  <!-- 패널 2: 배트 -->
  <text x="275" y="50" fill="#4a453c" font-size="13" font-weight="600">배트 · Bat</text>
  <path d="M285 205 L345 70 L392 128 L435 96 L472 190" fill="none" stroke="#4a453c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="285" y1="205" x2="472" y2="205" stroke="#4a453c" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
  <g fill="#4a453c">
    <circle cx="285" cy="205" r="3.4"/><circle cx="345" cy="70" r="3.4"/>
    <circle cx="392" cy="128" r="3.4"/><circle cx="435" cy="96" r="3.4"/>
  </g>
  <circle cx="472" cy="190" r="4" fill="#8f3d3a"/>
  <text x="276" y="222" fill="#4a453c" font-size="11">X</text>
  <text x="340" y="60" fill="#4a453c" font-size="11">A</text>
  <text x="382" y="146" fill="#4a453c" font-size="11">B≈0.45</text>
  <text x="428" y="85" fill="#4a453c" font-size="11">C</text>
  <text x="436" y="212" fill="#8f3d3a" font-size="11">D≈0.886</text>
  <text x="275" y="246" fill="#4a453c" font-size="11" opacity="0.8">얕은 B, 깊은 D — X 바로 앞에서 완성</text>

  <!-- 패널 3: 크랩 -->
  <text x="515" y="50" fill="#4a453c" font-size="13" font-weight="600">크랩 · Crab</text>
  <path d="M520 170 L575 75 L622 122 L660 100 L700 228" fill="none" stroke="#4a453c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="520" y1="170" x2="710" y2="170" stroke="#8f3d3a" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.7"/>
  <text x="636" y="164" fill="#8f3d3a" font-size="10.5">X 수준 — D가 넘는다</text>
  <g fill="#4a453c">
    <circle cx="520" cy="170" r="3.4"/><circle cx="575" cy="75" r="3.4"/>
    <circle cx="622" cy="122" r="3.4"/><circle cx="660" cy="100" r="3.4"/>
  </g>
  <circle cx="700" cy="228" r="4" fill="#8f3d3a"/>
  <text x="508" y="172" fill="#4a453c" font-size="11">X</text>
  <text x="570" y="65" fill="#4a453c" font-size="11">A</text>
  <text x="614" y="140" fill="#4a453c" font-size="11">B≈0.50</text>
  <text x="652" y="90" fill="#4a453c" font-size="11">C</text>
  <text x="664" y="244" fill="#8f3d3a" font-size="11">D≈1.618</text>
  <text x="515" y="266" fill="#4a453c" font-size="11" opacity="0.8">X 밖 확장 — 극단적 PRZ</text>
</svg>
