<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="270" fill="#f7f1e6"/>
  <text x="24" y="26" font-size="12" fill="#8a7f70" letter-spacing="1">PRZ · POTENTIAL REVERSAL ZONE — 비율이 겹치는 띠</text>

  <!-- PRZ 밴드 -->
  <rect x="60" y="158" width="600" height="36" fill="#b08948" opacity="0.14"/>
  <text x="64" y="152" fill="#b08948" font-size="11" font-weight="600">PRZ — 잠재 반전 구간</text>

  <!-- 세 격자의 투사선 -->
  <line x1="60" y1="164" x2="660" y2="164" stroke="#b08948" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="60" y1="177" x2="660" y2="177" stroke="#b08948" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="60" y1="183" x2="660" y2="183" stroke="#b08948" stroke-width="1.2" stroke-dasharray="9 4"/>
  <text x="556" y="160" fill="#4a453c" font-size="10.5">BC × 1.27</text>
  <text x="556" y="173" fill="#4a453c" font-size="10.5">XA × 0.786</text>
  <text x="556" y="196" fill="#4a453c" font-size="10.5">AB=CD 투사</text>

  <!-- 가격 경로 X→A→B→C→D -->
  <path d="M60 222 L205 55 L320 148 L420 92 L530 176" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 스윙 점 -->
  <circle cx="60" cy="222" r="4" fill="#4a453c"/>
  <circle cx="205" cy="55" r="4" fill="#4a453c"/>
  <circle cx="320" cy="148" r="4" fill="#4a453c"/>
  <circle cx="420" cy="92" r="4" fill="#4a453c"/>
  <circle cx="530" cy="176" r="4.5" fill="#8f3d3a"/>
  <text x="44" y="240" fill="#4a453c" font-size="13" font-weight="600">X</text>
  <text x="198" y="44" fill="#4a453c" font-size="13" font-weight="600">A</text>
  <text x="312" y="168" fill="#4a453c" font-size="13" font-weight="600">B</text>
  <text x="412" y="80" fill="#4a453c" font-size="13" font-weight="600">C</text>
  <text x="538" y="172" fill="#8f3d3a" font-size="13" font-weight="600">D</text>

  <!-- 반전 후보 -->
  <path d="M530 176 L580 140 L630 112" fill="none" stroke="#2c5a4c" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
  <text x="598" y="104" fill="#2c5a4c" font-size="11">반전 후보 · reversal</text>

  <!-- X 수준 안내 -->
  <line x1="60" y1="222" x2="530" y2="222" stroke="#4a453c" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
  <text x="330" y="238" fill="#4a453c" font-size="10.5" opacity="0.75">X 수준 — 내부 되돌림 패턴의 무효화 앵커</text>
</svg>
