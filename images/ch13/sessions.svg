  <rect x="375" y="116" width="104" height="70" fill="none" stroke="#b08948" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="427" y="110" fill="#b08948" font-size="10.5" text-anchor="middle" font-weight="bold">겹침 · overlap — 킬존</text>
  <text x="156" y="198" fill="#4a453c" font-size="10" text-anchor="middle">아시아 레인지 — 얇은 유동성</text>
