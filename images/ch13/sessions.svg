  <rect width="700" height="300" fill="#f7f1e6"/>
  <text x="350" y="26" fill="#4a453c" font-size="12" text-anchor="middle">세션 타임라인 — 하루 안의 유동성 지도 (UTC)</text>
  <!-- 변동성 곡선 -->
  <text x="45" y="58" fill="#4a453c" font-size="11">변동성 · volatility</text>
  <path d="M40 105 C110 105 190 100 246 80 C290 65 350 55 400 54 C440 53 470 57 505 68 C560 84 620 102 660 106" fill="none" stroke="#4a453c" stroke-width="2" stroke-linecap="round"/>
  <!-- 세션 밴드 -->
  <rect x="246" y="122" width="233" height="24" fill="#2c5a4c" opacity="0.22"/>
  <text x="362" y="138" fill="#2c5a4c" font-size="11" text-anchor="middle">런던 · London 08–17</text>
  <rect x="40" y="156" width="232" height="24" fill="#b08948" opacity="0.28"/>
  <text x="156" y="172" fill="#4a453c" font-size="11" text-anchor="middle">아시아 · Asia 00–09</text>
  <rect x="375" y="156" width="233" height="24" fill="#8f3d3a" opacity="0.2"/>
  <text x="491" y="172" fill="#8f3d3a" font-size="11" text-anchor="middle">뉴욕 · New York 13–22</text>
