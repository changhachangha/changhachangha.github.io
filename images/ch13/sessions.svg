  <text x="40" y="248" fill="#4a453c" font-size="10">시각 · UTC</text>
  <text x="350" y="270" fill="#4a453c" font-size="10.5" text-anchor="middle">참여자의 시간대가 유동성을 만든다 — 세션 경계는 법칙이 아니라 관행의 집계</text>
