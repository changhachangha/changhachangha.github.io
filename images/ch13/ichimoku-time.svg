<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="290" fill="#f7f1e6"/>
  <text x="350" y="24" fill="#4a453c" font-size="12" text-anchor="middle">일목 시간론 — 변곡 후보 윈도</text>
  <!-- 가격 경로: 변곡일(고·저점) 사이의 등락 -->
  <path d="M50 175 C110 145 165 95 220 88 C280 80 335 135 380 162 C430 192 500 120 570 102 C605 93 640 118 655 132" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 변곡일 표시 -->
  <circle cx="50" cy="175" r="4" fill="#b08948"/>
  <circle cx="220" cy="88" r="4" fill="#b08948"/>
  <circle cx="380" cy="162" r="4" fill="#b08948"/>
  <circle cx="570" cy="102" r="4" fill="#b08948"/>
  <text x="56" y="192" fill="#4a453c" font-size="10.5">변곡일 · swing</text>
  <text x="220" y="76" fill="#4a453c" font-size="10.5" text-anchor="middle">변곡일</text>
  <!-- 기본수치 투사: 변곡일(17일째)에서 +9 +17 +26 -->
  <rect x="302" y="58" width="16" height="147" fill="#b08948" opacity="0.15"/>
  <rect x="382" y="58" width="16" height="147" fill="#b08948" opacity="0.15"/>
  <rect x="472" y="58" width="16" height="147" fill="#b08948" opacity="0.15"/>
  <line x1="310" y1="58" x2="310" y2="205" stroke="#b08948" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="390" y1="58" x2="390" y2="205" stroke="#b08948" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="480" y1="58" x2="480" y2="205" stroke="#b08948" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="310" y="50" fill="#b08948" font-size="11" text-anchor="middle" font-weight="bold">+9</text>
  <text x="390" y="50" fill="#b08948" font-size="11" text-anchor="middle" font-weight="bold">+17</text>
  <text x="480" y="50" fill="#b08948" font-size="11" text-anchor="middle" font-weight="bold">+26</text>
  <text x="560" y="52" fill="#4a453c" font-size="10.5">후보 윈도 — 약속이 아니라 후보</text>
  <!-- 시간축 -->
  <line x1="50" y1="205" x2="650" y2="205" stroke="#4a453c" stroke-width="1.6"/>
  <line x1="650" y1="205" x2="642" y2="201" stroke="#4a453c" stroke-width="1.6"/>
  <line x1="650" y1="205" x2="642" y2="209" stroke="#4a453c" stroke-width="1.6"/>
  <text x="50" y="222" fill="#4a453c" font-size="10" text-anchor="middle">0</text>
  <text x="140" y="222" fill="#4a453c" font-size="10" text-anchor="middle">9</text>
  <text x="220" y="222" fill="#4a453c" font-size="10" text-anchor="middle">17</text>
  <text x="310" y="222" fill="#4a453c" font-size="10" text-anchor="middle">26</text>
  <text x="380" y="222" fill="#4a453c" font-size="10" text-anchor="middle">33</text>
  <text x="470" y="222" fill="#4a453c" font-size="10" text-anchor="middle">42</text>
  <text x="570" y="222" fill="#4a453c" font-size="10" text-anchor="middle">52</text>
  <text x="650" y="222" fill="#4a453c" font-size="10" text-anchor="middle">60</text>
  <text x="50" y="240" fill="#4a453c" font-size="10">일수 · days</text>
  <!-- 대등수치: 같은 간격의 반복 -->
  <line x1="50" y1="252" x2="220" y2="252" stroke="#8f3d3a" stroke-width="1.4"/>
  <line x1="50" y1="247" x2="50" y2="257" stroke="#8f3d3a" stroke-width="1.4"/>
  <line x1="220" y1="247" x2="220" y2="257" stroke="#8f3d3a" stroke-width="1.4"/>
  <line x1="220" y1="252" x2="390" y2="252" stroke="#8f3d3a" stroke-width="1.4"/>
  <line x1="390" y1="247" x2="390" y2="257" stroke="#8f3d3a" stroke-width="1.4"/>
  <text x="135" y="270" fill="#8f3d3a" font-size="10.5" text-anchor="middle">17일</text>
  <text x="305" y="270" fill="#8f3d3a" font-size="10.5" text-anchor="middle">17일</text>
  <text x="410" y="256" fill="#8f3d3a" font-size="10.5">대등수치 — 같은 간격의 반복</text>
</svg>
