<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="700" height="300" fill="#f7f1e6"/>
  <text x="350" y="24" fill="#4a453c" font-size="12" text-anchor="middle">시장 폭 다이버전스 — 지수는 오르는데 참여는 줄다</text>
  <!-- 위 패널: 지수 -->
  <text x="50" y="46" fill="#4a453c" font-size="11">지수 · index</text>
  <path d="M50 120 L140 95 L230 78 L300 106 L390 92 L520 46 L590 74 L660 56" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="230" cy="78" r="3.5" fill="#2c5a4c"/>
  <circle cx="520" cy="46" r="3.5" fill="#2c5a4c"/>
  <line x1="230" y1="78" x2="520" y2="46" stroke="#2c5a4c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="375" y="56" fill="#2c5a4c" font-size="10.5" text-anchor="middle">고점 상승 · higher highs</text>
  <!-- 구분선 -->
  <line x1="40" y1="148" x2="660" y2="148" stroke="#b08948" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <!-- 아래 패널: A/D 라인 -->
  <text x="50" y="172" fill="#4a453c" font-size="11">A/D 라인 · advance-decline line</text>
  <path d="M50 240 L140 212 L230 190 L300 218 L390 214 L520 200 L590 226 L660 236" fill="none" stroke="#4a453c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="230" cy="190" r="3.5" fill="#8f3d3a"/>
  <circle cx="520" cy="200" r="3.5" fill="#8f3d3a"/>
  <line x1="230" y1="190" x2="520" y2="200" stroke="#8f3d3a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="375" y="236" fill="#8f3d3a" font-size="10.5" text-anchor="middle">고점 하락 · lower highs</text>
  <!-- 대응 수직선 -->
  <line x1="230" y1="78" x2="230" y2="190" stroke="#b08948" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="520" y1="46" x2="520" y2="200" stroke="#b08948" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="350" y="285" fill="#4a453c" font-size="10.5" text-anchor="middle">지수의 고점은 높아지는데 폭의 고점은 낮아진다 — 상호 확인 실패</text>
</svg>
