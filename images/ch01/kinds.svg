<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="720" height="300" fill="#f7f1e6"/>
  <text x="20" y="26" font-size="12" fill="#8a7f70" letter-spacing="1">SAME EVENT, DIFFERENT QUESTION</text>

  <!-- column 1: claim -->
  <rect x="20" y="44" width="214" height="226" rx="10" fill="#fffdf8" stroke="#d8cdb8"/>
  <rect x="20" y="44" width="214" height="40" rx="10" fill="#2c5a4c"/>
  <rect x="20" y="64" width="214" height="20" fill="#2c5a4c"/>
  <text x="32" y="70" font-size="14" font-weight="600" fill="#f7f1e6"><tspan font-size="10" font-weight="400">claim</tspan></text>
  <text x="32" y="112" font-size="12" fill="#6b6355">question</text>
  <text x="32" y="130" font-size="14" font-weight="600" fill="#4a453c">Why does it move?</text>
  <text x="32" y="160" font-size="12" fill="#6b6355">example</text>
  <text x="32" y="178" font-size="12" fill="#4a453c">Dow, Wyckoff, auction market</text>
  <text x="32" y="208" font-size="12" fill="#6b6355">test</text>
  <text x="32" y="226" font-size="12" fill="#4a453c">counterexamples can be counted</text>
  <text x="32" y="250" font-size="11" fill="#8f3d3a">Open to test. It can be wrong.</text>

  <!-- column 2: display -->
  <rect x="253" y="44" width="214" height="226" rx="10" fill="#fffdf8" stroke="#d8cdb8"/>
  <rect x="253" y="44" width="214" height="40" rx="10" fill="#b08948"/>
  <rect x="253" y="64" width="214" height="20" fill="#b08948"/>
  <text x="265" y="70" font-size="14" font-weight="600" fill="#f7f1e6"><tspan font-size="10" font-weight="400">display</tspan></text>
  <text x="265" y="112" font-size="12" fill="#6b6355">question</text>
  <text x="265" y="130" font-size="14" font-weight="600" fill="#4a453c">How is it shown?</text>
  <text x="265" y="160" font-size="12" fill="#6b6355">example</text>
  <text x="265" y="178" font-size="12" fill="#4a453c">candle, renko, TPO, indicators</text>
  <text x="265" y="208" font-size="12" fill="#6b6355">test</text>
  <text x="265" y="226" font-size="12" fill="#4a453c">asks about usefulness</text>
  <text x="265" y="250" font-size="11" fill="#8f3d3a">Not true or false.</text>

  <!-- column 3: renaming -->
  <rect x="486" y="44" width="214" height="226" rx="10" fill="#fffdf8" stroke="#d8cdb8"/>
  <rect x="486" y="44" width="214" height="40" rx="10" fill="#8f3d3a"/>
  <rect x="486" y="64" width="214" height="20" fill="#8f3d3a"/>
  <text x="498" y="70" font-size="14" font-weight="600" fill="#f7f1e6"><tspan font-size="10" font-weight="400">renaming</tspan></text>
  <text x="498" y="112" font-size="12" fill="#6b6355">question</text>
  <text x="498" y="130" font-size="14" font-weight="600" fill="#4a453c">What is it called?</text>
  <text x="498" y="160" font-size="12" fill="#6b6355">example</text>
  <text x="498" y="178" font-size="12" fill="#4a453c">order block, sweep, FVG</text>
  <text x="498" y="208" font-size="12" fill="#6b6355">test</text>
  <text x="498" y="226" font-size="12" fill="#4a453c">look at index aliases</text>
  <text x="498" y="250" font-size="11" fill="#8f3d3a">A new name, not a new fact.</text>
</svg>
