<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="720" height="270" fill="#f7f1e6"/>
  <text x="24" y="26" font-size="12" fill="#8a7f70" letter-spacing="1">PREMIUM / DISCOUNT · 스윙 구간의 위쪽 절반과 아래쪽 절반</text>

  <!-- 구간 밴드 -->
  <rect x="40" y="50" width="640" height="80" fill="#8f3d3a" opacity="0.08"/>
  <rect x="40" y="130" width="640" height="80" fill="#2c5a4c" opacity="0.08"/>

  <!-- EQ 중간선 -->
  <line x1="40" y1="130" x2="680" y2="130" stroke="#b08948" stroke-width="1.6" stroke-dasharray="7 5"/>
  <!-- 스윙 고저 가이드 -->
  <line x1="40" y1="50" x2="680" y2="50" stroke="#b08948" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>
  <line x1="40" y1="210" x2="680" y2="210" stroke="#b08948" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>

  <!-- 가격 경로: 저점 → 고점 → 되돌림(디스카운트) → 재상승 -->
  <path d="M70 210 L250 50 L420 168 L560 88"
        fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M250 50 L420 168" fill="none" stroke="#8f3d3a" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="70" cy="210" r="4" fill="#2c5a4c"/>
  <circle cx="250" cy="50" r="4" fill="#2c5a4c"/>
  <circle cx="420" cy="168" r="4" fill="#8f3d3a"/>
  <circle cx="560" cy="88" r="4" fill="#2c5a4c"/>

  <!-- 라벨 -->
  <text x="56" y="66" fill="#8f3d3a" font-size="12" font-weight="600">프리미엄 · premium</text>
  <text x="56" y="84" fill="#4a453c" font-size="10" opacity="0.75">구간 위쪽 절반 — 비싼 쪽</text>
  <text x="56" y="166" fill="#2c5a4c" font-size="12" font-weight="600">디스카운트 · discount</text>
  <text x="56" y="184" fill="#4a453c" font-size="10" opacity="0.75">구간 아래쪽 절반 — 싼 쪽</text>
  <text x="586" y="126" fill="#b08948" font-size="12" font-weight="600" text-anchor="end">EQ · 0.5 균형</text>
  <text x="586" y="46" fill="#4a453c" font-size="10" text-anchor="end" opacity="0.75">스윙 고점</text>
  <text x="586" y="226" fill="#4a453c" font-size="10" text-anchor="end" opacity="0.75">스윙 저점</text>
  <text x="420" y="192" fill="#8f3d3a" font-size="10" text-anchor="middle">되돌림이 디스카운트에서 멈춤</text>
</svg>
