<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="720" height="270" fill="#f7f1e6"/>
  <text x="24" y="26" font-size="12" fill="#8a7f70" letter-spacing="1">SAME PATH, DIFFERENT SWING COUNT · 같은 경로, 다른 스윙 수</text>

  <!-- 좌: 작은 스케일 -->
  <text x="30" y="52" fill="#4a453c" font-size="13" font-weight="600">작은 스케일 · sensitive</text>
  <path d="M40 200 L85 128 L112 156 L140 134 L154 143 L188 96 L208 104 L242 62 L266 88 L298 44 L322 64"
        fill="none" stroke="#2c5a4c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 모든 피벗 표시 -->
  <g fill="#2c5a4c">
    <circle cx="85" cy="128" r="3.4"/><circle cx="112" cy="156" r="3.4"/>
    <circle cx="140" cy="134" r="3.4"/><circle cx="154" cy="143" r="3.4"/>
    <circle cx="188" cy="96" r="3.4"/><circle cx="208" cy="104" r="3.4"/>
    <circle cx="242" cy="62" r="3.4"/><circle cx="266" cy="88" r="3.4"/>
    <circle cx="298" cy="44" r="3.4"/>
  </g>
  <circle cx="40" cy="200" r="3.4" fill="#8f3d3a"/><circle cx="322" cy="64" r="3.4" fill="#8f3d3a"/>
  <text x="40" y="238" fill="#4a453c" font-size="11" opacity="0.8">피벗 11개 — 신호가 많고 거짓도 많다</text>

  <!-- 중앙 구분선 -->
  <line x1="355" y1="40" x2="355" y2="240" stroke="#b08948" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>

  <!-- 우: 큰 스케일 -->
  <text x="385" y="52" fill="#4a453c" font-size="13" font-weight="600">큰 스케일 · coarse</text>
  <path d="M390 200 L435 128 L462 156 L490 134 L504 143 L538 96 L558 104 L592 62 L616 88 L648 44 L672 64"
        fill="none" stroke="#2c5a4c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 큰 피벗만 연결 -->
  <path d="M390 200 L435 128 L462 156 L592 62 L616 88 L648 44 L672 64"
        fill="none" stroke="#b08948" stroke-width="1.4" stroke-dasharray="5 4"/>
  <g fill="#8f3d3a">
    <circle cx="435" cy="128" r="4"/><circle cx="462" cy="156" r="4"/>
    <circle cx="592" cy="62" r="4"/><circle cx="616" cy="88" r="4"/>
    <circle cx="648" cy="44" r="4"/>
  </g>
  <circle cx="390" cy="200" r="4" fill="#8f3d3a"/><circle cx="672" cy="64" r="4" fill="#8f3d3a"/>
  <!-- 필터링된 작은 피벗 (연하게) -->
  <g fill="#4a453c" opacity="0.35">
    <circle cx="490" cy="134" r="2.4"/><circle cx="504" cy="143" r="2.4"/>
    <circle cx="538" cy="96" r="2.4"/><circle cx="558" cy="104" r="2.4"/>
  </g>
  <text x="390" y="238" fill="#4a453c" font-size="11" opacity="0.8">피벗 6개 — 신호가 늦지만 견고하다</text>
</svg>
