<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="IBM Plex Sans KR, sans-serif">
  <rect width="720" height="260" fill="#f7f1e6"/>
  <text x="24" y="26" font-size="12" fill="#8a7f70" letter-spacing="1">POLARITY · roles swap — broken resistance becomes support</text>

  <!-- 존 (zone) -->
  <rect x="30" y="106" width="660" height="26" fill="#b08948" opacity="0.14"/>
  <rect x="30" y="106" width="660" height="26" fill="none" stroke="#b08948" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="648" y="100" fill="#8a7f70" font-size="11" text-anchor="end">zone</text>

  <!-- 가격 경로 -->
  <path d="M40 205 L98 116 L72 170 L152 118 L128 164 L198 96 L248 52 L322 118 L382 66 L448 92"
        fill="none" stroke="#2c5a4c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 거절 구간(저항)은 적색으로 -->
  <path d="M40 205 L98 116 L72 170 L152 118 L128 164 L198 96"
        fill="none" stroke="#8f3d3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 접점 표시 -->
  <g fill="#8f3d3a">
    <circle cx="98" cy="116" r="3.8"/><circle cx="152" cy="118" r="3.8"/>
  </g>
  <circle cx="322" cy="118" r="4" fill="#2c5a4c"/>

  <!-- 라벨 -->
  <text x="72" y="98" fill="#8f3d3a" font-size="12" font-weight="600">resistance</text>
  <text x="86" y="146" fill="#4a453c" font-size="10" opacity="0.75">rejected twice</text>
  <text x="196" y="82" fill="#4a453c" font-size="11" font-weight="600">break</text>
  <path d="M228 74 L252 66" stroke="#4a453c" stroke-width="1" fill="none"/>
  <text x="330" y="146" fill="#2c5a4c" font-size="12" font-weight="600">support</text>
  <text x="330" y="162" fill="#4a453c" font-size="10" opacity="0.75">bounces from the same zone</text>

  <text x="40" y="244" fill="#4a453c" font-size="11" opacity="0.8">a zone that rejected as resistance supports on the retest after the break</text>
</svg>
