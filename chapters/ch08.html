        <div class="crumb">Chapter 08</div>
        <h2 class="page-title">캔들, 대표만</h2>
        <p class="lede">사전 전체를 외우지 않는다. 위치(추세 말인가)와 다음 봉 확인이 본체다.</p>
        <div class="grid two">
          <div class="card">
            <h4>단일</h4>
            <p>도지, 해머/교수형, 슈팅스타/역해머, 마루보즈, 핀바. 같은 해머 모양이 하락 말이면 해머, 상승 말이면 교수형.</p>
          </div>
          <div class="card">
            <h4>2·3봉</h4>
            <p>장악형, 하라미/인사이드바, 관통형/흑운형, 트위저. 모닝스타/이브닝스타, 삼병.</p>
          </div>
        </div>
        <p>사카타 오법의 삼산은 머리어깨에, 삼공은 갭에 가깝다. 단독 캔들 신호의 기대값은 얇다. 구조와 레벨 위에서만 본다.</p>
